[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solix-link"
version = "0.1.0"
description = "Local Anker SOLIX monitoring and controls over Bluetooth and isolated native MQTT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=0.21", "cryptography>=41"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mqtt = ["paho-mqtt>=2,<3"]
tui = ["textual>=8.2,<9"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "aiohttp>=3.10,<4", "PyYAML>=6,<7", "Jinja2>=3,<4"]

[project.scripts]
solix-link = "solix_link.cli:main"
solix-gen2 = "solix_link.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solix_link*", "solix_gen2*"]

[tool.setuptools.package-data]
solix_link = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]
