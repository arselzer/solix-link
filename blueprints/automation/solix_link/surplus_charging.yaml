blueprint:
  name: SOLIX Link owned surplus charging
  description: >-
    Disabled by default. C1000 Gen 2 main 1.1.4.9 only. Uses the same durable
    owner as price charging; release before switching policies. Requires a
    configured reserve, empty Standard plan, fresh positive-export W sensor,
    mains and AC output on, Fast off, and inactive backup/clock/countdowns.
    Steps nonzero charging limits only. Disarming requests guarded restoration
    of the original power limit. Hold leaves the saved setting unchanged.
    No zero-import or true charging-pause guarantee. Recreate automations
    made from the older helper-latch surplus blueprint; input names changed.
  domain: automation
  input:
    station:
      name: C1000 Gen 2
      selector:
        device:
          integration: solix_link
    export_sensor:
      name: Grid export sensor (W)
      selector:
        entity:
          domain: sensor
    armed:
      name: Arming helper
      selector:
        entity:
          domain: input_boolean
    manual_override:
      name: Override helper (none, hold, charge)
      selector:
        entity:
          domain: input_select
    positive_export_confirmed:
      name: Positive sensor values mean grid export (verified)
      default: false
      selector:
        boolean:
    minimum_reserve:
      name: Required configured reserve (%)
      default: 20
      selector:
        number:
          min: 5
          max: 95
          step: 5
          mode: box
    idle_watts:
      name: Nonzero idle limit (W)
      default: 100
      selector:
        number:
          min: 100
          max: 1200
          step: 100
          mode: box
    maximum_watts:
      name: Maximum limit (W)
      default: 1000
      selector:
        number:
          min: 100
          max: 1200
          step: 100
          mode: box
    maximum_step_w:
      name: Maximum change per cycle (W)
      default: 100
      selector:
        number:
          min: 100
          max: 1200
          step: 100
          mode: box
    export_start:
      name: Start export threshold (W)
      default: 600
      selector:
        number:
          min: 0
          max: 20000
          step: 1
          mode: box
    export_stop:
      name: Stop export threshold (W)
      default: 300
      selector:
        number:
          min: 0
          max: 20000
          step: 1
          mode: box
    target_export_w:
      name: Target remaining export (W)
      default: 100
      selector:
        number:
          min: 0
          max: 20000
          step: 1
          mode: box
    deadband_w:
      name: Export deadband (W)
      default: 50
      selector:
        number:
          min: 0
          max: 20000
          step: 1
          mode: box
    export_max_age:
      name: Maximum signal age (seconds)
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          mode: box
    cooldown:
      name: Cooldown (seconds)
      default: 300
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
initial_state: false
mode: single
max_exceeded: silent
triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: state
    entity_id: !input armed
  - trigger: state
    entity_id: !input manual_override
variables:
  armed_entity: !input armed
  override_entity: !input manual_override
conditions:
  - condition: template
    value_template: "{{ is_state(armed_entity, 'off') or (is_state(armed_entity, 'on') and states(override_entity) in ['none', 'hold', 'charge']) }}"
actions:
  - action: solix_link.charging_policy
    data:
      device_id: !input station
      policy: surplus
      export_entity: !input export_sensor
      mode: "{{ 'apply' if is_state(armed_entity, 'on') else 'release' }}"
      armed: "{{ is_state(armed_entity, 'on') }}"
      override: "{{ states(override_entity) if states(override_entity) in ['none', 'hold', 'charge'] else 'hold' }}"
      positive_export_confirmed: !input positive_export_confirmed
      minimum_reserve: !input minimum_reserve
      idle_watts: !input idle_watts
      maximum_watts: !input maximum_watts
      maximum_step_w: !input maximum_step_w
      export_start: !input export_start
      export_stop: !input export_stop
      target_export_w: !input target_export_w
      deadband_w: !input deadband_w
      export_max_age: !input export_max_age
      cooldown: !input cooldown
