name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './python[server,mqtt,tui,test]'
      - run: python -m pytest python/tests home_assistant_tests -q
        env:
          PYTHONPATH: python:python/tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './python[server,mqtt,tui,test]'
      - run: npm ci
      - run: npm run build
      - run: npm run build:dashboard
      - run: git diff --exit-code -- python/solix_link/web
      - run: npm run test:protocol
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard
